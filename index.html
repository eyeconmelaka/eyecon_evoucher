<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Eyecon eVoucher</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.12);
      text-align: center;
      overflow: hidden;
    }


    /* ==============================
       LOGO HEADER
    ============================== */

    .logo-section {
      background: #494d4e;
      padding: 28px 20px 25px;
      text-align: center;
    }

    .logo {
      width: 190px;
      max-width: 70%;
      height: auto;
      display: block;
      margin: 0 auto;
    }


    /* ==============================
       MAIN CONTENT
    ============================== */

    .content {
      padding: 28px 22px 30px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 8px;
      color: #333;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 23px;
      line-height: 1.5;
    }


    /* ==============================
       EVENT BOX
    ============================== */

    .event-box {
      background: #fff7f0;
      border-radius: 10px;
      padding: 14px 15px;
      margin-bottom: 20px;
    }

    .event-label {
      font-size: 11px;
      color: #999;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
    }

    .event-name {
      font-size: 15px;
      font-weight: bold;
      color: #f58220;
      line-height: 1.4;
    }


    /* ==============================
       BUTTONS
    ============================== */

    .claim-button,
    .download-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #f58220;
      color: white;
      transition: 0.2s;
    }

    .claim-button:hover,
    .download-button:hover {
      background: #df6f12;
    }

    .claim-button:active,
    .download-button:active {
      transform: scale(0.99);
    }


    /* ==============================
       NOTES
    ============================== */

    .note {
      margin-top: 17px;
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }


    /* ==============================
       VOUCHER
    ============================== */

    .voucher {
      display: none;
    }

    .success {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 17px;
      color: #333;
    }

    #voucherPreview {
      width: 100%;
      display: block;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    .download-button {
      margin-top: 17px;
    }


    /* ==============================
       CLAIMED MESSAGE
    ============================== */

    .claimed-box {
      display: none;
      background: #fff7f0;
      border: 1px solid #f58220;
      color: #d96b10;
      padding: 17px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold;
    }

    canvas {
      display: none;
    }

  </style>

</head>


<body>

<div class="page">

  <div class="card">


    <!-- LOGO HEADER -->

    <div class="logo-section">

      <img
        src="logo.png"
        alt="Eyecon"
        class="logo"
      >

    </div>


    <div class="content">


      <!-- CLAIM SECTION -->

      <div id="claimSection">

        <h1>
          Claim Your eVoucher
        </h1>

        <div class="subtitle">
          A complimentary voucher specially for you.
        </div>


        <!-- EVENT INFORMATION -->

        <div class="event-box">

          <div class="event-label">
            EVENT
          </div>

          <div
            class="event-name"
            id="eventDisplay"
          ></div>

        </div>


        <button
          class="claim-button"
          onclick="claimVoucher()"
        >
          CLAIM MY VOUCHER
        </button>


        <div class="note">
          Limited to one voucher per device.
        </div>

      </div>



      <!-- ==============================
           VOUCHER SECTION
      ============================== -->

      <div
        id="voucherSection"
        class="voucher"
      >

        <div
          id="successMessage"
          class="success"
        >
          🎉 Your eVoucher is ready!
        </div>


        <img
          id="voucherPreview"
          alt="Eyecon eVoucher"
        >


        <button
          id="downloadButton"
          class="download-button"
          onclick="downloadVoucher()"
        >
          ↓ DOWNLOAD VOUCHER
        </button>


        <div
          id="claimedBox"
          class="claimed-box"
        >
          ✓ VOUCHER ALREADY CLAIMED
        </div>


        <div
          id="voucherNote"
          class="note"
        >
          Save this voucher and present it during redemption.
        </div>

      </div>


      <canvas id="voucherCanvas"></canvas>

    </div>

  </div>

</div>



<script>


/* ==================================================
   EVENT SETTINGS
================================================== */

const EVENT_NAME =
  "CTRM 09/2026";

const EVENT_ID =
  "ctrm-09-2026";


/* ==================================================
   VOUCHER IMAGE
================================================== */

const VOUCHER_IMAGE =
  "evoucher.jpeg";


/* ==================================================
   STORAGE
================================================== */

const STORAGE_KEY =
  "eyecon_voucher_" + EVENT_ID;


/* ==================================================
   DISPLAY EVENT NAME
================================================== */

document.getElementById(
  "eventDisplay"
).textContent = EVENT_NAME;


/* ==================================================
   CHECK IF ALREADY DOWNLOADED
================================================== */

window.addEventListener(
  "load",
  function () {

    const alreadyDownloaded =
      localStorage.getItem(STORAGE_KEY);

    if (alreadyDownloaded === "downloaded") {
      showAlreadyClaimed();
    }

  }
);


/* ==================================================
   CLAIM VOUCHER
================================================== */

function claimVoucher() {

  generateVoucher();

}


/* ==================================================
   GENERATE VOUCHER
================================================== */

function generateVoucher() {

  const image =
    new Image();

  image.src =
    VOUCHER_IMAGE;


  image.onload = function () {

    const canvas =
      document.getElementById(
        "voucherCanvas"
      );

    const ctx =
      canvas.getContext("2d");


    /* ORIGINAL IMAGE SIZE */

    canvas.width =
      image.naturalWidth;

    canvas.height =
      image.naturalHeight;


    /* DRAW ORIGINAL VOUCHER */

    ctx.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );


    /* ==================================================
       EVENT NAME
       BOTTOM-RIGHT
       BLACK
       NO "EVENT" WORD
    ================================================== */


    /*
       Smaller number = closer to right edge
    */

    const rightPadding =
      canvas.width * 0.025;


    /*
       Smaller number = closer to bottom
    */

    const bottomPadding =
      canvas.height * 0.012;


    const eventX =
      canvas.width - rightPadding;

    const eventY =
      canvas.height - bottomPadding;


    /* RIGHT ALIGN */

    ctx.textAlign =
      "right";

    ctx.textBaseline =
      "bottom";


    /* BLACK EVENT NAME */

    ctx.fillStyle =
      "#000000";


    /*
       EVENT NAME FONT SIZE

       0.016 = current
       0.014 = smaller
       0.012 = even smaller
    */

    drawRightText(
      ctx,
      EVENT_NAME,
      eventX,
      eventY,
      canvas.width * 0.50,
      canvas.width * 0.016
    );


    /* ==================================================
       CREATE FINAL VOUCHER
    ================================================== */

    const generatedVoucher =
      canvas.toDataURL(
        "image/jpeg",
        0.95
      );


    document.getElementById(
      "voucherPreview"
    ).src =
      generatedVoucher;


    document.getElementById(
      "claimSection"
    ).style.display =
      "none";


    document.getElementById(
      "voucherSection"
    ).style.display =
      "block";

  };


  image.onerror = function () {

    alert(
      "Unable to load evoucher.jpeg. Please make sure the image is uploaded to GitHub."
    );

  };

}


/* ==================================================
   AUTO RESIZE EVENT NAME
================================================== */

function drawRightText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  startingSize
) {

  let fontSize =
    startingSize;


  ctx.font =
    "bold " +
    fontSize +
    "px Arial";


  while (
    ctx.measureText(text).width > maxWidth &&
    fontSize > 10
  ) {

    fontSize -= 1;

    ctx.font =
      "bold " +
      fontSize +
      "px Arial";

  }


  ctx.fillText(
    text,
    x,
    y
  );

}


/* ==================================================
   DOWNLOAD VOUCHER
================================================== */

function downloadVoucher() {

  const canvas =
    document.getElementById(
      "voucherCanvas"
    );


  const link =
    document.createElement(
      "a"
    );


  link.download =
    "Eyecon-eVoucher-" +
    EVENT_ID +
    ".jpeg";


  link.href =
    canvas.toDataURL(
      "image/jpeg",
      0.95
    );


  document.body.appendChild(
    link
  );

  link.click();

  document.body.removeChild(
    link
  );


  /* SAVE DOWNLOADED STATUS */

  localStorage.setItem(
    STORAGE_KEY,
    "downloaded"
  );


  /* HIDE DOWNLOAD BUTTON */

  document.getElementById(
    "downloadButton"
  ).style.display =
    "none";


  /* SHOW CLAIMED MESSAGE */

  document.getElementById(
    "claimedBox"
  ).style.display =
    "block";

}


/* ==================================================
   ALREADY CLAIMED
================================================== */

function showAlreadyClaimed() {

  document.getElementById(
    "claimSection"
  ).style.display =
    "none";


  document.getElementById(
    "voucherSection"
  ).style.display =
    "block";


  document.getElementById(
    "voucherPreview"
  ).style.display =
    "none";


  document.getElementById(
    "downloadButton"
  ).style.display =
    "none";


  document.getElementById(
    "claimedBox"
  ).style.display =
    "block";


  document.getElementById(
    "successMessage"
  ).textContent =
    "Thank you!";


  document.getElementById(
    "voucherNote"
  ).textContent =
    "This voucher has already been downloaded on this device.";

}


</script>

</body>

</html>
