<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eyecon eVoucher</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 28px 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
      text-align: center;
    }

    .brand {
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 22px;
      margin: 12px 0 5px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .claim-button,
    .download-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #333;
      color: white;
    }

    .claim-button:hover,
    .download-button:hover {
      background: #111;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }

    .voucher {
      display: none;
      margin-top: 20px;
    }

    #voucherPreview {
      width: 100%;
      border-radius: 12px;
      display: block;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .download-button {
      margin-top: 15px;
    }

    .success {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .claimed-box {
      display: none;
      padding: 16px;
      border-radius: 10px;
      background: #f2f2f2;
      margin-top: 15px;
      font-weight: bold;
    }

    .event-display {
      margin-bottom: 18px;
      font-size: 13px;
      color: #666;
    }

    canvas {
      display: none;
    }

  </style>
</head>

<body>

<div class="page">

  <div class="card">

    <div class="brand">EYECON</div>

    <!-- BEFORE CLAIM -->

    <div id="claimSection">

      <h1>Claim Your eVoucher</h1>

      <div class="subtitle">
        Claim your complimentary Eyecon eVoucher.
      </div>

      <div class="event-display" id="eventDisplay"></div>

      <button
        class="claim-button"
        onclick="claimVoucher()"
      >
        CLAIM MY VOUCHER
      </button>

      <div class="note">
        Limited to one voucher per device.
      </div>

    </div>


    <!-- AFTER CLAIM -->

    <div id="voucherSection" class="voucher">

      <div class="success">
        🎉 Your eVoucher is ready!
      </div>

      <!-- Generated voucher -->
      <img
        id="voucherPreview"
        alt="Eyecon eVoucher"
      >

      <button
        id="downloadButton"
        class="download-button"
        onclick="downloadVoucher()"
      >
        ↓ DOWNLOAD VOUCHER
      </button>

      <div id="claimedBox" class="claimed-box">
        ✓ VOUCHER ALREADY CLAIMED
      </div>

      <div class="note">
        Save this voucher and present it during redemption.
      </div>

    </div>


    <!-- Hidden Canvas -->

    <canvas id="voucherCanvas"></canvas>

  </div>

</div>


<script>

/* =========================================
   EVENT SETTINGS
   CHANGE THE EVENT NAME HERE
========================================= */

const EVENT_NAME =
  "CTRM/09/26";


/* =========================================
   VOUCHER IMAGE
========================================= */

const VOUCHER_IMAGE = "evoucher.jpeg";


/* =========================================
   UNIQUE STORAGE KEY FOR THIS EVENT

   IMPORTANT:
   Change this when creating a NEW event.
========================================= */

const EVENT_ID =
  "lions-club-cataract-camp-2026";

const STORAGE_KEY =
  "eyecon_voucher_" + EVENT_ID;


/* =========================================
   DISPLAY EVENT NAME
========================================= */

document.getElementById("eventDisplay")
  .textContent = EVENT_NAME;


/* =========================================
   CHECK IF ALREADY DOWNLOADED
========================================= */

window.onload = function () {

  const alreadyClaimed =
    localStorage.getItem(STORAGE_KEY);

  if (alreadyClaimed === "downloaded") {

    showAlreadyClaimed();

  }

};


/* =========================================
   CLAIM VOUCHER
========================================= */

function claimVoucher() {

  generateVoucher();

}


/* =========================================
   GENERATE VOUCHER IMAGE
========================================= */

function generateVoucher() {

  const image = new Image();

  image.src = VOUCHER_IMAGE;

  image.onload = function () {

    const canvas =
      document.getElementById("voucherCanvas");

    const ctx =
      canvas.getContext("2d");


    /* Use original voucher dimensions */

    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;


    /* Draw original voucher */

    ctx.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );


    /* =====================================
       EVENT NAME POSITION
    ===================================== */

    const centerX = canvas.width / 2;

    /*
      Position near bottom.

      You can change 0.92 if necessary.

      0.90 = slightly higher
      0.95 = lower
    */

    const eventY =
      canvas.height * 0.92;


    /* EVENT label */

    ctx.textAlign = "center";

    ctx.fillStyle = "#555";

    ctx.font =
      "bold " +
      Math.round(canvas.width * 0.025) +
      "px Arial";

    ctx.fillText(
      "EVENT",
      centerX,
      eventY - (canvas.height * 0.045)
    );


    /* Event Name */

    ctx.fillStyle = "#222";

    ctx.font =
      "bold " +
      Math.round(canvas.width * 0.035) +
      "px Arial";


    /* Prevent very long event names overflowing */

    drawCenteredText(
      ctx,
      EVENT_NAME,
      centerX,
      eventY,
      canvas.width * 0.85,
      canvas.width * 0.035
    );


    /* Create generated image */

    const generatedVoucher =
      canvas.toDataURL(
        "image/jpeg",
        0.95
      );


    document.getElementById(
      "voucherPreview"
    ).src = generatedVoucher;


    document.getElementById(
      "claimSection"
    ).style.display = "none";


    document.getElementById(
      "voucherSection"
    ).style.display = "block";

  };


  image.onerror = function () {

    alert(
      "Voucher image could not be loaded. Please check that evoucher.jpeg is uploaded to GitHub."
    );

  };

}


/* =========================================
   TEXT AUTO RESIZE
========================================= */

function drawCenteredText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  startingSize
) {

  let fontSize = startingSize;

  ctx.font =
    "bold " + fontSize + "px Arial";


  while (
    ctx.measureText(text).width > maxWidth &&
    fontSize > 18
  ) {

    fontSize -= 2;

    ctx.font =
      "bold " + fontSize + "px Arial";

  }


  ctx.fillText(
    text,
    x,
    y
  );

}


/* =========================================
   DOWNLOAD VOUCHER
========================================= */

function downloadVoucher() {

  const canvas =
    document.getElementById("voucherCanvas");


  const link =
    document.createElement("a");


  link.download =
    "Eyecon-eVoucher-" +
    EVENT_ID +
    ".jpeg";


  link.href =
    canvas.toDataURL(
      "image/jpeg",
      0.95
    );


  link.click();


  /* Remember download on this device */

  localStorage.setItem(
    STORAGE_KEY,
    "downloaded"
  );


  /* Disable download */

  document.getElementById(
    "downloadButton"
  ).style.display = "none";


  document.getElementById(
    "claimedBox"
  ).style.display = "block";

}


/* =========================================
   ALREADY CLAIMED
========================================= */

function showAlreadyClaimed() {

  document.getElementById(
    "claimSection"
  ).style.display = "none";


  document.getElementById(
    "voucherSection"
  ).style.display = "block";


  document.getElementById(
    "voucherPreview"
  ).style.display = "none";


  document.getElementById(
    "downloadButton"
  ).style.display = "none";


  document.getElementById(
    "claimedBox"
  ).style.display = "block";


  document.querySelector(
    "#voucherSection .success"
  ).textContent =
    "Thank you!";


  document.querySelector(
    "#voucherSection .note"
  ).textContent =
    "This voucher has already been downloaded on this device.";

}

</script>

</body>
</html>
